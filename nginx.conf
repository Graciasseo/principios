map $uri $principios_cache_control {
    default "no-cache";
    ~^/_app/immutable/ "public, max-age=31536000, immutable";
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control $principios_cache_control always;

    location = /service-worker.js { try_files $uri =404; }
    location /_app/immutable/ { try_files $uri =404; }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
}
